name: 'Build Multi-OS (Private Test)'

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab at any time
  push:
    branches:
      - 'combo/map-and-export'
      - 'main'
    tags:
      - 'v*' # Automatically triggers when pushing a version tag (e.g. v1.6.4-test1)

jobs:
  build:
    name: Build for ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: 'Linux (AppImage & DEB)'
            os: 'ubuntu-24.04'
            artifact-name: 'RapidRAW-Linux-x86_64'
            artifact-path: |
              src-tauri/target/release/bundle/**/*.AppImage
              src-tauri/target/release/bundle/**/*.deb
          - name: 'Windows 11 (x64 Installer)'
            os: 'windows-latest'
            artifact-name: 'RapidRAW-Windows-x64'
            artifact-path: |
              src-tauri/target/release/bundle/**/*.exe
              src-tauri/target/release/bundle/**/*.msi
          - name: 'macOS (Apple Silicon DMG)'
            os: 'macos-latest'
            artifact-name: 'RapidRAW-macOS-AppleSilicon'
            artifact-path: |
              src-tauri/target/release/bundle/**/*.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ''

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Install frontend dependencies
        run: npm install

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: ${{ startsWith(matrix.platform.os, 'ubuntu') }}
        with:
          args: --verbose

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact-name }}
          path: ${{ matrix.platform.artifact-path }}
          retention-days: 14
          if-no-files-found: error
